<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Write-Good Checker</title>
</head>
<body>
  <div id="app">
    <header>
      <h1>Write-Good Checker</h1>
      <p>
        Paste text below to receive writing suggestions.
      </p>
    </header>

    <textarea
      id="input"
      placeholder="Type or paste text here..."
    ></textarea>

    <section class="results-section">
      <h2>Suggestions</h2>
      <div id="results">
        Enter text above to begin.
      </div>
    </section>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
